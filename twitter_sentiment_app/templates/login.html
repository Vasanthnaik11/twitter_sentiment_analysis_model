<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body {background:#0f172a;color:white;text-align:center;font-family:Arial;}
input{padding:10px;margin:10px;width:250px;}
button{padding:10px;background:#22c55e;color:white;border:none;}
</style>
</head>
<body>

<h2>Login</h2>
<form id="loginForm">
<input type="email" id="email" placeholder="Email"><br>
<input type="password" id="password" placeholder="Password"><br>
<button>Login</button>
</form>

<p><a href="/register_page">Register</a></p>

<script>
loginForm.onsubmit = async (e)=>{
e.preventDefault();

let res = await fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value,
password:password.value
})
});

let d = await res.json();

if(d.status=="ok") window.location="/dashboard";
else alert("Login Failed");
};
</script>

</body>
</html>
